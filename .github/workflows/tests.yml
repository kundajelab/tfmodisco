name: Tests

on:
  push:
    branches: [master]
  # No branch filter, so pull requests stacked on another branch are tested too.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Install the package and test dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[test]"

      # addopts deselects the CLI tests, so select everything explicitly.
      - name: Run the test suite
        run: |
          source .venv/bin/activate
          python -m pytest -m "cmd or not cmd"
